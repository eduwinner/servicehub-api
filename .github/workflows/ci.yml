# CI do ServiceHub API (Aula 14): build + testes (PostgreSQL real via Testcontainers) e build da imagem Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify (testes de unidade, web e integração + cobertura)
        run: ./mvnw -B verify

      - name: Relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - name: docker build
        run: docker build -t servicehub-api:${{ github.sha }} .

      - name: Sobe a stack com Compose e confere o healthcheck
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' servicehub-api || true)
            echo "api: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          curl -sf http://localhost:8090/api/v1/info
          # métricas: fechadas na porta pública, abertas só na porta interna 8081 (ADR-0008)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/actuator/prometheus)" = 401
          docker compose exec -T api wget -qO- http://localhost:8081/actuator/prometheus | grep -q jvm_memory_used_bytes
          ! curl -sf --max-time 3 http://localhost:8081/actuator/prometheus
          docker compose down -v
