# Prometheus do ServiceHub (Aula 15). Coleta a API pela porta interna 8081, que só existe
# dentro da rede do Compose e libera /actuator/prometheus sem token (ADR-0008).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: servicehub-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
