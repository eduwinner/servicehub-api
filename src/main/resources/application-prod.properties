# Perfil de produção (ativado no Docker Compose: SPRING_PROFILES_ACTIVE=prod)

# Logs estruturados em JSON (formato ECS), prontos para ELK/Datadog/Loki; o requestId vai junto (MDC)
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.servicehub=INFO
logging.level.org.hibernate.SQL=WARN

# O Swagger continua ligado para a banca e a aula; em produção real, desligue:
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false
