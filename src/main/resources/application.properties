# ===== ServiceHub API - Configurações =====

# Porta do servidor (padrão é 8080)
server.port=8080

# Nome da aplicação
spring.application.name=servicehub-api

# Prefixo global para todas as rotas
server.servlet.context-path=/

# Nível de log (DEBUG para desenvolvimento)
logging.level.com.servicehub=DEBUG

# Exibir queries SQL 
spring.jpa.show-sql=true

# Formato de data/hora na API
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Conexão com Banco de Dados PostgreSQL (via Docker)
spring.datasource.url=jdbc:postgresql://postgres:5432/servicehub
spring.datasource.username=servicehub
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



# Log com id de rastreio da requisicao (RequestIdFilter)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
