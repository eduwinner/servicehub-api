# ===== ServiceHub API - Configurações =====
# Todo valor sensível ou que muda por ambiente vem de variável de ambiente,
# com um padrão de desenvolvimento depois dos dois-pontos: ${VARIAVEL:padrao}.

spring.application.name=servicehub-api
server.port=${SERVER_PORT:8080}

# Banco de dados (o Compose publica o Postgres em localhost:5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/servicehub}
spring.datasource.username=${DB_USER:servicehub}
spring.datasource.password=${DB_PASS:secret}

# JPA: o schema é responsabilidade do Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segurança (Fase 2): JWT obrigatório, admin inicial e CORS
servicehub.jwt.secret=${JWT_SECRET:}
servicehub.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
servicehub.admin.email=${SERVICEHUB_ADMIN_EMAIL:}
servicehub.admin.password=${SERVICEHUB_ADMIN_PASSWORD:}
servicehub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Erros: ProblemDetail (RFC 9457), sem stack trace nem mensagem interna
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# Paginação: padrão 20, máximo 100 itens por página
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# Documentação OpenAPI (Aula 5)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Logs com o id de rastreio da requisição (RequestIdFilter)
logging.level.com.servicehub=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
