# ServiceHub API + PostgreSQL (Aula 12)
#
#   docker compose up -d --build           API em http://localhost:8090 (Swagger em /docs)
#   docker compose --profile tools up -d   também sobe o pgAdmin em http://localhost:8091
#   docker compose down                    para tudo, mantendo os dados do volume pg_data
#   docker compose down -v                 para tudo e APAGA os dados
#
# Valores sensíveis vêm do arquivo .env (opcional, nunca versionado). Os padrões abaixo
# servem só para desenvolvimento e aula; troque JWT_SECRET e a senha do admin em qualquer
# ambiente compartilhado.

services:
  postgres:
    image: postgres:16-alpine
    container_name: servicehub-db
    environment:
      POSTGRES_DB: ${DB_NAME:-servicehub}
      POSTGRES_USER: ${DB_USER:-servicehub}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-servicehub} -d ${DB_NAME:-servicehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - servicehub-net
    restart: unless-stopped

  api:
    build: .
    image: servicehub-api:latest
    container_name: servicehub-api
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-servicehub}
      DB_USER: ${DB_USER:-servicehub}
      DB_PASS: ${DB_PASS:-secret}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-com-32-bytes}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      SERVICEHUB_ADMIN_EMAIL: ${SERVICEHUB_ADMIN_EMAIL:-admin@servicehub.com}
      SERVICEHUB_ADMIN_PASSWORD: ${SERVICEHUB_ADMIN_PASSWORD:-Admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - servicehub-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: servicehub-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8091}:80"
    depends_on:
      - postgres
    networks:
      - servicehub-net

networks:
  servicehub-net:
    driver: bridge

volumes:
  pg_data:
