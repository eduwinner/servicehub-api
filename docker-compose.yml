# ServiceHub API + PostgreSQL (Aula 12)
#
#   docker compose up -d --build           API em http://localhost:8090 (Swagger em /docs)
#   docker compose --profile tools up -d   também sobe o pgAdmin em http://localhost:8091 (sem login)
#   docker compose --profile observability up -d   também sobe Prometheus (9090) e Grafana (3001)
#   docker compose down                    para tudo, mantendo os dados do volume pg_data
#   docker compose down -v                 para tudo e APAGA os dados
#
# Valores sensíveis vêm do arquivo .env (opcional, nunca versionado). Os padrões abaixo
# servem só para desenvolvimento e aula; troque JWT_SECRET e a senha do admin em qualquer
# ambiente compartilhado.

services:
  postgres:
    image: postgres:16-alpine
    container_name: servicehub-db
    environment:
      POSTGRES_DB: ${DB_NAME:-servicehub}
      POSTGRES_USER: ${DB_USER:-servicehub}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-servicehub} -d ${DB_NAME:-servicehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - servicehub-net
    restart: unless-stopped

  api:
    build: .
    image: servicehub-api:latest
    container_name: servicehub-api
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-servicehub}
      DB_USER: ${DB_USER:-servicehub}
      DB_PASS: ${DB_PASS:-secret}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-com-32-bytes}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      SERVICEHUB_ADMIN_EMAIL: ${SERVICEHUB_ADMIN_EMAIL:-admin@servicehub.com}
      SERVICEHUB_ADMIN_PASSWORD: ${SERVICEHUB_ADMIN_PASSWORD:-Admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      METRICS_INTERNAL_PORT: 8081
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8090}:8080"
    # 8081 = coleta do Prometheus sem token (ADR-0008). NÃO publicar: só a rede interna alcança.
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - servicehub-net
    restart: unless-stopped

  # pgAdmin web (opcional). Abre já com dois servidores cadastrados, sem login nem senha:
  #   "ServiceHub (referência)"          → postgres:5432, o banco deste compose
  #   "Banco do aluno (localhost:5433)"  → Postgres publicado no host pelo compose do aluno
  # Só o pgAdmin, sem subir o nosso banco (para inspecionar o banco de uma equipe):
  #   docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: servicehub-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # grava as senhas num pgpass com permissão 600 (exigência do libpq) e segue o entrypoint oficial
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "postgres:5432:*:${DB_USER:-servicehub}:${DB_PASS:-secret}" > /tmp/pgpassfile
        echo "host.docker.internal:*:*:${STUDENT_DB_USER:-servicehub}:${STUDENT_DB_PASS:-secret}" >> /tmp/pgpassfile
        chmod 600 /tmp/pgpassfile
        exec /entrypoint.sh
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8091}:80"
    networks:
      - servicehub-net

  # Observabilidade (opcional, Aula 15): Prometheus coleta a API pela porta interna 8081
  # e o Grafana abre com a fonte de dados e o painel "ServiceHub API" prontos, sem login.
  #   docker compose --profile observability up -d
  #   Prometheus: http://localhost:9090   Grafana: http://localhost:3001
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: servicehub-prometheus
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    networks:
      - servicehub-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: servicehub-grafana
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/servicehub.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - servicehub-net

networks:
  servicehub-net:
    driver: bridge

volumes:
  pg_data:
